<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshAgents</title>
<style>
:root{color-scheme:light;
--bg:#fbfbfa;--side:#f4f4f2;--surface:#fff;--ink:#1f2023;--mute:#6f7480;--faint:#9aa0ab;--hair:#e8e8e5;--hover:#f0f0ed;--shadow:0 1px 2px rgba(20,20,30,.06),0 1px 1px rgba(20,20,30,.04);--shadow2:0 6px 20px rgba(20,20,30,.10);
--accent:#3b6df0;--accentbg:#e8efff;
--c1:#8d6ce0;--c1bg:#f5f1fc;--c2:#e8890c;--c2bg:#fcf4e8;--c3:#2f9e6a;--c3bg:#eaf5ef;
--bad:#d23b30;--badbg:#fdeceb;--warn:#b86a05;--warnbg:#fdf1de;--ok:#23875a;--okbg:#e5f4ec;--idle:#7a8090;--idlebg:#eeeeeb}
:root[data-theme=dark]{color-scheme:dark;
--bg:#161618;--side:#1b1b1e;--surface:#222226;--ink:#ececee;--mute:#a0a3ad;--faint:#6f7380;--hair:#2c2c31;--hover:#2a2a2f;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 10px 30px rgba(0,0,0,.5);
--accent:#7c9cff;--accentbg:#222c4a;
--c1:#6aa7ff;--c1bg:#1b1b1e;--c2:#ff9f43;--c2bg:#1b1b1e;--c3:#4cd194;--c3bg:#1b1b1e;
--bad:#ff7b72;--badbg:#3a1f1e;--warn:#f5b04d;--warnbg:#38290f;--ok:#4cd194;--okbg:#17301f;--idle:#9a9eab;--idlebg:#2b2b30}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
--bg:#161618;--side:#1b1b1e;--surface:#222226;--ink:#ececee;--mute:#a0a3ad;--faint:#6f7380;--hair:#2c2c31;--hover:#2a2a2f;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 10px 30px rgba(0,0,0,.5);
--accent:#7c9cff;--accentbg:#222c4a;
--c1:#6aa7ff;--c1bg:#1b1b1e;--c2:#ff9f43;--c2bg:#1b1b1e;--c3:#4cd194;--c3bg:#1b1b1e;
--bad:#ff7b72;--badbg:#3a1f1e;--warn:#f5b04d;--warnbg:#38290f;--ok:#4cd194;--okbg:#17301f;--idle:#9a9eab;--idlebg:#2b2b30}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);padding:16px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;border-right:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;line-height:1.2}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.up{background:var(--ok)}.dot.down{background:var(--bad)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--mute);text-align:left;width:100%;transition:background .12s}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current=page]{background:var(--hover);color:var(--ink);font-weight:600}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--faint)}
.nav .n.hot{color:var(--bad);font-weight:700}
.spacer{flex:1}
.theme{color:var(--mute);font-size:13px;padding:6px 10px;border-radius:8px;text-align:left}
.theme:hover{background:var(--hover);color:var(--ink)}
/* main */
main{padding:32px 40px 64px;min-width:0}
.head h1{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.2}
.statusline{margin:6px 0 0;color:var(--mute);font-size:15px;display:flex;align-items:center;gap:8px}
.statusline.bad{color:var(--bad)}.statusline.bad .dot{background:var(--bad)}.statusline.ok .dot{background:var(--ok)}
.banner{margin:16px 0 0;padding:12px 16px;border-radius:12px;background:var(--badbg);color:var(--bad)}
.view{margin-top:24px}
[hidden]{display:none!important}
/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{border-radius:16px;padding:12px;background:var(--c1bg)}
.col.c2{background:var(--c2bg)}.col.c3{background:var(--c3bg)}
.colhead{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-size:14px;color:var(--mute);font-weight:550}
.colhead .dot{background:var(--c1)}.col.c2 .dot{background:var(--c2)}.col.c3 .dot{background:var(--c3)}
.colhead .cnt{margin-left:auto;font-weight:400;color:var(--faint)}
.cards{display:flex;flex-direction:column;gap:12px;min-height:8px}
.hint{color:var(--faint);padding:12px 6px;font-size:14px}
.card{background:var(--surface);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:left;border:0;width:100%;color:inherit}
.card:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.title{margin:0;font-size:15.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mute);background:var(--idlebg);padding:2px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.hot{background:var(--badbg);color:var(--bad)}
.badge{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.4;padding:8px 10px;border-radius:8px}
.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.foot{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px;border-top:1px solid var(--hair);padding-top:12px;margin:0 -16px -4px;padding-left:16px;padding-right:16px}
.status{display:flex;align-items:center;gap:8px;min-width:0}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .dot.live{background:var(--ok)}.status .dot.idle{background:var(--warn)}
.when{margin-left:auto;white-space:nowrap;color:var(--faint)}
/* tags */
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--idlebg);color:var(--idle);white-space:nowrap}
.tag.open,.tag.live{background:var(--okbg);color:var(--ok)}
.tag.tainted,.tag.expired{background:var(--warnbg);color:var(--warn)}
.tag.retracted,.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.interface,.tag.storage,.tag.finding{background:var(--accentbg);color:var(--accent)}
.tag.config,.tag.rename{background:var(--warnbg);color:var(--warn)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:700;color:#fff;flex:none}
/* lists */
.list{display:flex;flex-direction:column;gap:12px;max-width:860px}
.row{background:var(--surface);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.row .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .txt{font-size:15.5px;font-weight:550;overflow-wrap:anywhere}
.row.retracted .txt{text-decoration:line-through;color:var(--mute)}
.row.tainted{box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}
.mute{color:var(--mute);font-size:13.5px}
.link{align-self:flex-start;text-align:left;color:var(--accent);font-size:13.5px;font-weight:550}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--idlebg);border-radius:10px;padding:2px;margin-bottom:16px}
.seg button{padding:5px 12px;border-radius:8px;color:var(--mute);font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.chain{margin:4px 0 0 4px;padding-left:12px;border-left:2px solid var(--hair);font-size:14px}
.sub{margin:16px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650}
.svgwrap{overflow:auto;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:8px}
svg text{font:12px ui-monospace,Menlo,monospace;fill:var(--ink)}
.n-ok{fill:var(--okbg);stroke:var(--ok)}.n-warn{fill:var(--warnbg);stroke:var(--warn)}.n-bad{fill:var(--badbg);stroke:var(--bad)}.n-idle{fill:var(--idlebg);stroke:var(--idle)}.n-info{fill:var(--accentbg);stroke:var(--accent)}
.e{stroke:var(--faint);fill:none;opacity:.7}.e.based{stroke:var(--accent);opacity:.8}
.preview{padding:12px 16px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mini{width:100%;border-collapse:collapse}.mini td{padding:6px 4px;border-bottom:1px solid var(--hair);vertical-align:top}
.memline{margin:8px 0 0;font-size:14px;color:var(--mute)}
.memline button{color:var(--accent);font-weight:550}.memline button:hover{text-decoration:underline}
.mem{display:flex;flex-direction:column;gap:24px;max-width:820px}
.memtop{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.memtop .big{font-size:22px;font-weight:650;letter-spacing:-.01em}
.part{background:var(--surface);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.part h3{margin:0;font-size:17px;letter-spacing:-.01em}
.part .why{margin:-6px 0 0;color:var(--mute);font-size:14px}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--hair)}
.rule:first-of-type{border-top:0;padding-top:4px}
.rule .rt{font-size:15.5px;overflow-wrap:anywhere}
.quote{background:var(--bg);border-radius:12px;padding:12px 16px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.bar{height:8px;border-radius:4px;background:var(--idlebg);overflow:hidden;min-width:80px;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.partner{display:grid;grid-template-columns:minmax(0,1fr) 140px 120px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.partner:first-of-type{border-top:0}
.clickable{cursor:pointer}.clickable:hover{box-shadow:var(--shadow2)}
/* empty */
.empty{max-width:560px;margin:48px auto;text-align:center;color:var(--mute)}
.empty pre{display:inline-block;text-align:left;background:var(--surface);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);color:var(--ink);font-size:13px;max-width:100%;overflow:auto}
/* panel */
#scrim{position:fixed;inset:0;background:rgba(10,10,15,.35);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);box-shadow:var(--shadow2);transform:translateX(102%);transition:transform .2s ease;z-index:21;overflow:auto;padding:24px}
#panel.on{transform:none}
#panel h2{margin:12px 0 8px;font-size:20px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.pclose{float:right;color:var(--mute);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.pclose:hover{background:var(--hover)}
.metaline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:14px}
.pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--surface);border-radius:12px;padding:12px 16px;max-height:260px;overflow:auto;box-shadow:var(--shadow)}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr);align-content:start}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:8px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--hair)}
 .nav{flex-direction:row;overflow-x:auto;order:3;width:100%;gap:4px}
 .nav button{width:auto;white-space:nowrap}
 .spacer{display:none}.theme{margin-left:auto}
 main{padding:20px 16px 48px}.head h1{font-size:24px}
 .board,.two{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i class="dot" id="dot"></i><div>MeshAgents<small id="ws"></small></div></div>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="spacer"></div>
    <button class="theme" id="theme" type="button"></button>
  </aside>
  <main>
    <div class="head"><h1 id="pagetitle">Board</h1><p class="statusline" id="statusline"></p><p class="memline" id="memline" hidden></p></div>
    <div class="banner" id="banner" role="alert" hidden></div>
    <div id="views"></div>
  </main>
</div>
<div id="scrim"></div>
<aside id="panel" aria-label="Session details" aria-hidden="true"></aside>
<script>
"use strict";
/* Everything from the graph is untrusted text from other sessions: the DOM is built with
   createElement + textContent only. */
var S = null, C = null, M = null, togetherCache = {}, togetherAsked = {}, S0 = 0, skew = 0, view = "board", panelId = null, panelSig = "", decFilter = "all",
    openWhy = {}, whyCache = {}, openChains = {}, codeSel = null, pendingPanel = null, VIEWS = {}, boardEls = null;
var NAV = [["board", "Board"], ["memory", "Memory"], ["files", "Files"], ["decisions", "Decisions"], ["code", "Code"], ["graph", "Graph"]];
var $ = function (id) { return document.getElementById(id); };

function h(tag, attrs) {
  var el = document.createElement(tag), i;
  for (var k in (attrs || {})) {
    if (k === "class") el.className = attrs[k];
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  function add(c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  for (i = 2; i < arguments.length; i++) add(arguments[i]);
  return el;
}
var NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  var el = document.createElementNS(NS, tag);
  for (var k in (attrs || {})) el.setAttribute(k, attrs[k]);
  if (text != null) el.textContent = text;
  return el;
}
function nowS() { return Date.now() / 1000 + skew; }
function short(ts) {
  var s = Math.max(0, Math.round(nowS() - ts));
  return s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d";
}
function age(ts) { return ts ? short(ts) + " ago" : "never"; }
function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function clip(t, n) { t = String(t); return t.length > n ? t.slice(0, n - 1) + "…" : t; }
function base(p) { return String(p).split("/").pop(); }
function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
function tag(text, cls) { return h("span", { "class": "tag " + (cls || text) }, text); }
function avatar(id) {
  var n = 0, i, t = String(id).replace(/^sess[-_]/, "");
  for (i = 0; i < t.length; i++) n = (n * 31 + t.charCodeAt(i)) % 360;
  return h("span", { "class": "av", style: "background:hsl(" + n + " 45% 48%)", title: id }, t.slice(0, 2).toUpperCase());
}
function statusClass(st) {
  return { live: "n-ok", open: "n-ok", tainted: "n-warn", expired: "n-warn", retracted: "n-bad", superseded: "n-idle", ended: "n-idle", done: "n-idle" }[st] || "n-idle";
}

/* Keyed in-place list: only items whose signature changed are rebuilt; order is fixed by moving nodes. */
function sync(parent, items) {
  var map = parent._k || (parent._k = {}), seen = {};
  items.forEach(function (it, i) {
    seen[it.key] = 1;
    var e = map[it.key];
    if (!e || e.sig !== it.sig) {
      var el = it.build();
      if (e) e.el.replaceWith(el);
      e = map[it.key] = { el: el, sig: it.sig };
    }
    var cur = parent.children[i];
    if (cur !== e.el) parent.insertBefore(e.el, cur || null);
  });
  Object.keys(map).forEach(function (k) { if (!seen[k]) { map[k].el.remove(); delete map[k]; } });
}

/* ---------- derived data ---------- */
function liveByFile() {
  var m = {};
  S.sessions.forEach(function (s) { if (s.status === "live") s.files.forEach(function (p) { (m[p] = m[p] || []).push(s.short); }); });
  return m;
}
function risks(s) {
  var out = [];
  if (s.status !== "live") return out;
  s.collides_with.forEach(function (c) { out.push({ level: "bad", text: "shares " + base(c.file) + " with " + c.with.join(", ") }); });
  ((C && C.impact) || []).forEach(function (it) {
    if (it.author !== s.owner || !it.callers.length) return;
    var c = it.callers[0], files = {};
    it.callers.forEach(function (x) { files[x.caller_file] = 1; });
    var n = Object.keys(files).length;
    out.push({ level: "bad", text: c.symbol + " change may break " + base(c.caller_file) + (n > 1 ? " +" + (n - 1) : "") });
  });
  var seen = false;
  S.decisions.forEach(function (d) {
    if (d.status === "tainted" && !seen && (d.author === s.owner || d.files.some(function (f) { return s.files.indexOf(f) >= 0; }))) {
      seen = true; out.push({ level: "warn", text: "builds on a retracted decision" });
    }
  });
  return out;
}
function column(s) { return s.status === "live" ? (risks(s).length ? 1 : 0) : 2; }
function boardSessions() { return S.sessions.filter(function (s) { return s.is_session || s.status === "live"; }); }
function handoffOf(s) { return (S.handoffs || []).filter(function (h) { return h.created_by === s.owner; })[0]; }

function headline() {
  var live = 0, att = 0;
  boardSessions().forEach(function (s) { if (s.status === "live") { live++; if (risks(s).length) att++; } });
  var coll = S.counts.collisions, imp = C && C.impact ? C.impact.length : 0;
  var parts = [];
  if (live) parts.push(plural(live, "session") + " working"); else parts.push("No sessions working");
  if (coll) parts.push(plural(coll, "collision risk"));
  if (imp) parts.push(plural(imp, "change") + " may break callers");
  if (S.counts.tainted) parts.push(S.counts.tainted + " tainted");
  var bad = att > 0;
  return { text: bad ? parts.join(" · ") : (live ? parts[0] + " · all clear" : "Nothing running · all clear"), bad: bad };
}

/* ---------- chrome ---------- */
function renderChrome() {
  $("ws").textContent = S.workspace;
  $("dot").className = "dot " + (S.connected ? "up" : "down");
  $("dot").title = S.connected ? "FalkorDB connected" : "FalkorDB unreachable";
  var b = $("banner");
  b.hidden = S.connected;
  b.textContent = S.connected ? "" : "Cannot read the graph (" + S.error + "). Is FalkorDB running? Try: docker compose up -d. Still polling.";
  var hl = headline(), sl = $("statusline");
  sl.className = "statusline " + (hl.bad ? "bad" : "ok");
  sl.textContent = "";
  sl.appendChild(h("i", { "class": "dot" }));
  sl.appendChild(document.createTextNode(S.connected ? hl.text : "Waiting for the database"));
  var c = S.counts, nums = { board: [c.live_sessions, false], files: [S.files.length, false], decisions: [c.open_decisions, c.tainted > 0], memory: [M && !M.empty ? M.rules.length + M.decisions.length + (M.handoff ? 1 : 0) : 0, false], code: [C ? C.counts.files : 0, false], graph: [0, false] };
  var nav = $("nav");
  sync(nav, NAV.map(function (n) {
    var num = nums[n[0]];
    return { key: n[0], sig: n[0] + view + num[0] + num[1], build: function () {
      var b = h("button", { type: "button", "aria-current": view === n[0] ? "page" : "false", onclick: function () { go(n[0]); } },
        n[1], num[0] ? h("span", { "class": "n" + (num[1] ? " hot" : "") }, num[0]) : null);
      return b;
    } };
  }));
  var ml = $("memline"), show = view === "board" && M && !M.empty;
  ml.hidden = !show;
  if (show) {
    ml.textContent = "";
    ml.appendChild(document.createTextNode("The next new session starts knowing " + [M.rules.length ? plural(M.rules.length, "rule") : "", M.decisions.length ? plural(M.decisions.length, "decision") : "", M.handoff ? "the last handoff" : ""].filter(Boolean).join(", ") + " (about " + M.tokens + " tokens). "));

/* ---------- together (co-change from git history) ---------- */
function renderTogether() {
  var v = VIEWS.code;

      .then(function (j) { togetherCache[path] = j; if (view === "code") renderTogether(); }).catch(function () { togetherAsked[path] = false; });
  }

}
function buildTogether(path, info) {

    h("p", { "class": "why" }, "Learned from git history: files that were committed in the same commits as " + path + "."));
  if (!info) { card.appendChild(h("div", { "class": "mute" }, "loading…")); return card; }

  if (!info.total) { card.appendChild(h("div", { "class": "mute" }, "No git history indexed for this file yet. The index is built when a session starts in a git repository.")); return card; }
  if (!info.partners.length) { card.appendChild(h("div", { "class": "mute" }, "Changed in " + plural(info.total, "commit") + ", but no other file changes with it often.")); return card; }
  info.partners.forEach(function (p) {
    card.appendChild(h("div", { "class": "partner" }, h("code", { "class": "mono", style: "overflow-wrap:anywhere" }, p.path),
      h("div", { "class": "bar", title: Math.round(p.ratio * 100) + "%" }, h("i", { style: "width:" + Math.round(p.ratio * 100) + "%" })),
      h("span", { "class": "mute", style: "text-align:right" }, p.n + " of " + info.total + " commits")));
  });
  return card;
}

/* ---------- memory: exactly what the next session is told ---------- */
function part(title, why, body) {
  return h("section", { "class": "part" }, h("h3", {}, title), h("p", { "class": "why" }, why), body);
}
function renderMemory() {
  var box = VIEWS.memory.box;

        h("div", { "class": "mute" }, "A new session would start with no extra context. Rules people state in a prompt (\"never use sqlite here\"), decisions and the last handoff are what it would be told."));
    } }]);

  }

    return h("div", { "class": "memtop" }, h("span", { "class": "big" }, "about " + M.tokens + " tokens"), h("span", { "class": "mute" }, M.chars + " characters, injected once when a new session starts"));
  } }];

      h("div", {}, M.rules.map(function (r) {

      })));
  } });
  if (M.live.length) items.push({ key: "live", sig: JSON.stringify(M.live), build: function () {
    return part("Other sessions working now", "The next session starts knowing who else is busy, so it does not collide.",
      h("div", {}, M.live.map(function (x) { return h("div", { "class": "rule" }, h("div", { "class": "rt" }, x.goal), h("div", { "class": "chips" }, h("code", { "class": "chip" }, x.owner.slice(0, 12)), x.files.slice(0, 4).map(function (f) { return h("code", { "class": "chip" }, base(f)); }))); })));
  } });

    return part("Recent decisions by others", "The next session starts knowing this. Tainted ones are flagged so it does not build on them.",
      h("div", {}, M.decisions.map(function (d) {
        return h("div", { "class": "rule" }, h("div", { "class": "line" }, tag(d.kind), d.status === "tainted" ? tag("tainted") : null, h("span", { "class": "mute", "data-fmt": "ago", "data-ts": d.created_at || "" }, age(d.created_at))), h("div", { "class": "rt" }, d.text));
      })));
  } });
  if (M.handoff) items.push({ key: "handoff", sig: JSON.stringify(M.handoff), build: function () {
    var ho = M.handoff;
    return part("Latest handoff", "The next session starts knowing where the last one stopped.",

        h("div", { "class": "rt", style: "font-weight:600" }, ho.goal),
        ho.spec ? h("div", {}, h("div", { "class": "sub", style: "margin-top:0" }, "What this session was asked to do"), h("div", { "class": "quote" }, ho.spec)) : null,
        ho.note ? h("div", {}, h("div", { "class": "sub", style: "margin-top:0" }, "Where it stopped"), h("div", { "class": "quote" }, ho.note)) : null,
        ho.files.length ? h("div", { "class": "chips" }, ho.files.map(function (f) { return h("code", { "class": "chip" }, f); })) : null,
        h("div", { "class": "mute" }, plural(ho.decisions, "decision") + " included · from ", h("code", {}, ho.created_by.slice(0, 12)), " · ", h("span", { "data-fmt": "ago", "data-ts": ho.created_at || "" }, age(ho.created_at)))));
  } });
  sync(box, items);
  tick();
}

/* ---------- graph ---------- */
function renderGraph() {
  var v = VIEWS.graph, g = S.graph;
  v.summary.textContent = g.nodes.length + " nodes" + (g.truncated ? " (capped)" : "") + " · hover for detail";
  sync(v.box, g.nodes.length ? [{ key: "g", sig: JSON.stringify(g), build: function () { return buildGraph(g); } }] : []);
}
function buildGraph(g) {
  var order = ["task", "artifact", "decision", "finding"], cols = {}, pos = {}, rows = 1, W = 230, H = 22;
  order.forEach(function (k) { cols[k] = []; });
  g.nodes.forEach(function (n) { cols[n.kind].push(n); });
  order.forEach(function (k, i) { cols[k].forEach(function (n, j) { pos[n.id] = { x: 8 + i * (W + 90), y: 30 + j * (H + 6) }; }); rows = Math.max(rows, cols[k].length); });
  var svg = sv("svg", { width: 16 + 4 * (W + 90) - 90, height: 40 + rows * (H + 6), role: "img", "aria-label": "overview graph" });
  order.forEach(function (k, i) { svg.appendChild(sv("text", { x: 8 + i * (W + 90), y: 14, style: "font-weight:700;opacity:.6" }, k + "s")); });
  g.edges.forEach(function (e) {
    var a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    var left = a.x < b.x, x1 = left ? a.x + W : a.x, x2 = left ? b.x : b.x + W;
    svg.appendChild(sv("path", { "class": "e" + (e.type === "BASED_ON" ? " based" : ""), d: "M" + x1 + " " + (a.y + H / 2) + " C" + (x1 + (left ? 40 : -40)) + " " + (a.y + H / 2) + " " + (x2 + (left ? -40 : 40)) + " " + (b.y + H / 2) + " " + x2 + " " + (b.y + H / 2) }));
  });
  g.nodes.forEach(function (n) {
    var p = pos[n.id], gg = sv("g");
    gg.appendChild(sv("title", {}, n.kind + (n.status ? " [" + n.status + "]" : "") + "\n" + n.label));
    gg.appendChild(sv("rect", { x: p.x, y: p.y, width: W, height: H, rx: 6, "class": n.kind === "artifact" ? "n-info" : statusClass(n.status) }));
    gg.appendChild(sv("text", { x: p.x + 8, y: p.y + 15 }, clip(n.label, 32)));
    svg.appendChild(gg);
  });
  return h("div", { "class": "svgwrap" }, svg);
}

/* ---------- views, routing, polling ---------- */
function emptyState() {
  return h("div", { "class": "empty" },
    h("h2", { style: "color:var(--ink);margin:0 0 8px" }, S.connected ? "Nothing here yet" : "Waiting for the database"),
    h("p", {}, "Start a session and MeshAgents fills this page by itself."),
    h("pre", { "class": "mono" }, "docker compose up -d\n.venv/bin/pip install -e . && .venv/bin/meshagents doctor\nclaude --plugin-dir /path/to/meshagents/plugin"),
    h("p", { "class": "mute" }, "Or try the scripted demo: .venv/bin/python demo/run_demo.py"));
}
function ensureViews() {
  if (VIEWS.board) return;
  var root = $("views");
  VIEWS.empty = { el: h("div", { "class": "view", hidden: "" }) };
  var b = buildBoard(); b.el.classList.add("view"); VIEWS.board = b;
  var fl = h("div", { "class": "list" }), fh = h("div", { "class": "hint" }, "No files touched yet.");
  VIEWS.files = { list: fl, hint: fh, el: h("div", { "class": "view" }, fl, fh) };
  var dl = h("div", { "class": "list" }), dh = h("div", { "class": "hint" });
  var seg = h("div", { "class": "seg", role: "group", "aria-label": "Filter" });
  VIEWS.decisions = { list: dl, hint: dh, seg: seg, el: h("div", { "class": "view" }, seg, dl, dh) };
  var sum = h("div", { "class": "mute", style: "margin-bottom:16px" }), ih = h("div", { "class": "sub", style: "margin-top:0" }), il = h("div", { "class": "list", style: "max-width:none" }), mp = h("div", {});
  var tg = h("div", { "class": "list", style: "max-width:820px;margin-top:16px" });
  VIEWS.code = { summary: sum, impHead: ih, imp: il, map: mp, tog: tg, el: h("div", { "class": "view" }, sum, ih, il, h("div", { "class": "sub" }, "Code map"), mp, tg) };
  var mm = h("div", { "class": "mem" });
  VIEWS.memory = { box: mm, el: h("div", { "class": "view" }, mm) };
  var gs = h("div", { "class": "mute", style: "margin-bottom:16px" }), gb = h("div", {});
  VIEWS.graph = { summary: gs, box: gb, el: h("div", { "class": "view" }, gs, gb) };
  ["empty", "board", "memory", "files", "decisions", "code", "graph"].forEach(function (k) { root.appendChild(VIEWS[k].el); });
}
function renderSeg() {
  var seg = VIEWS.decisions.seg;
  sync(seg, [["all", "All"], ["open", "Open"], ["issues", "Tainted or retracted"]].map(function (o) {
    return { key: o[0], sig: o[0] + (decFilter === o[0]), build: function () {
      return h("button", { type: "button", "aria-pressed": String(decFilter === o[0]), onclick: function () { decFilter = o[0]; renderSeg(); renderDecisions(); } }, o[1]);
    } };
  }));
}
function render() {
  if (!S) return;
  ensureViews();
  renderChrome();
  var empty = !S.sessions.length && !S.decisions.length && !S.findings.length;
  ["board", "memory", "files", "decisions", "code", "graph"].forEach(function (k) { VIEWS[k].el.hidden = empty || k !== view; });
  VIEWS.empty.el.hidden = !empty;
  if (empty) { if (!VIEWS.empty.el.firstChild) VIEWS.empty.el.appendChild(emptyState()); return; }
  if (view === "board") renderBoard();
  else if (view === "memory") renderMemory();
  else if (view === "files") renderFiles();
  else if (view === "decisions") { renderSeg(); renderDecisions(); }
  else if (view === "code") renderCode();
  else if (view === "graph") renderGraph();
  if (pendingPanel) {
    var hit = S.sessions.filter(function (x) { return x.id === pendingPanel || x.short === pendingPanel || x.owner === pendingPanel; })[0];
    pendingPanel = null;
    if (hit) openPanel(hit.id);
  }
  renderPanel(false);
}
function tick() {
  if (!S) return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-until]"), function (el) {
    el.textContent = "lease " + mmss(parseFloat(el.getAttribute("data-until")) - nowS());
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-fmt]"), function (el) {
    var ts = parseFloat(el.getAttribute("data-ts")), f = el.getAttribute("data-fmt");
    if (f === "ago") el.textContent = ts ? age(ts) : "";
    else if (f === "act" || f === "end") {
      var dot = el.previousSibling, st = el.getAttribute("data-st"), path = el.getAttribute("data-path"), fresh = ts && nowS() - ts < 90, txt, cls = "dot";
      if (f === "end") { txt = st === "expired" ? "Lease ended" : "Handed off"; }
      else if (fresh && path) { txt = "Editing " + path; cls += " live"; }
      else if (ts) { txt = "Idle " + short(ts); cls += " idle"; }
      else { txt = "Started, no edits yet"; cls += " idle"; }
      if (el.textContent !== txt) el.textContent = txt;
      if (dot && dot.className !== cls) dot.className = cls;
      var when = el.parentNode.nextSibling;
      if (when && when.className === "when") when.textContent = ts && (f === "end" || fresh) ? age(ts) : "";
    }
  });
}
function poll() {
  fetch("/api/memory", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { M = j.text !== undefined ? j : null; }).catch(function () {});
  fetch("/api/code", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { C = j.counts ? j : null; }).catch(function () {});
  fetch("/api/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    S = j; skew = j.now - Date.now() / 1000; render();
  }).catch(function (e) {
    if (S) { S.connected = false; S.error = "dashboard server not responding"; renderChrome(); }
    if (window.console) console.error(e);
  });
}
function route() {
  var m = location.hash.replace(/^#/, ""), v = m.split("/")[0];
  view = NAV.some(function (n) { return n[0] === v; }) ? v : "board";
  var id = m.split("/")[1];
  if (v === "code" && m.length > 5 && /^[\w.@+\- \/]{1,200}$/.test(m.slice(5))) codeSel = m.slice(5);
  if (v === "session" && id) pendingPanel = decodeURIComponent(id).slice(0, 100);
  if (id && /^[\w-]{1,80}$/.test(id) && view === "decisions" && !openWhy[id]) toggleWhy(id);
}
function applyTheme(t) {
  var root = document.documentElement;
  if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  $("theme").textContent = "Theme: " + t;
  try { localStorage.setItem("baton-theme", t); } catch (e) {}
}
$("theme").addEventListener("click", function () {
  var cur = document.documentElement.getAttribute("data-theme") || "auto";
  applyTheme({ auto: "light", light: "dark", dark: "auto" }[cur]);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });
$("scrim").addEventListener("click", closePanel);
window.addEventListener("hashchange", function () { route(); render(); });
var saved = "auto"; try { saved = localStorage.getItem("baton-theme") || "auto"; } catch (e) {}
applyTheme(saved);
route();
poll(); setInterval(poll, 1500); setInterval(tick, 1000);
</script>
